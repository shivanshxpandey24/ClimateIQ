services:
  - type: web
    name: climateiq-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAQ_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "8000"
